<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lin Ma — Head of Client Engineering at Sekai and founder of DreamRealized. Native iOS/Android, agent tooling, and products shipped end to end." />
    <title>Lin Ma — Client Engineering & Agent Tooling</title>
    <script>
      // Set flavour and accent before first paint so the page never flashes the wrong theme.
      (function () {
        var theme = null, accent = null;
        try { theme = localStorage.getItem("ps-theme"); accent = localStorage.getItem("ps-accent"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var root = document.documentElement;
        root.classList.add(theme === "dark" ? "mocha" : "latte");
        if (accent) root.dataset.accent = accent;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
